---
- name: Deactivate wireguard interfaces on clients
  hosts: clients
  remote_user: "{{ username_client }}"
  gather_facts: false

  tasks:
    - name: Deactivate Wireguard conf
      shell:
        cmd: for i in `ls confs`; do wg-quick down confs/$i ; done

- name: Deactivate wireguard interfaces on server 
  hosts: server
  remote_user: "{{ username_server }}"
  gather_facts: false

  tasks:
    - name: Deactivate Wireguard conf
      shell:
        cmd: for i in `ls confs`; do wg-quick down confs/$i ; done
  
- name: Kill all unecessary processes 
  hosts: clients
  remote_user: "{{ username_client }}"
  gather_facts: false

  tasks:
    - name: Killall iperf3 processes
      shell:
        cmd: killall -9 iperf3
      ignore_errors: true
    - name: Killall netperf processes
      shell:
        cmd: killall -9 netperf
      ignore_errors: true