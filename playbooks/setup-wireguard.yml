---
- name: "Generate conf files for server"
  hosts: server
  remote_user: "{{ username }}"
  tasks:
    - name: run wg_gen.py script for server config generation
      shell: | 
        /tmp/scripts/wg_gen.py \
          -k /root/keypairs.json \
          -b {{ batch }} \
          -s /root/server_keypairs.json \ 
          -n {{ n_clients }} \
          -o /root/confs \
          {% if is_personal %} -m {% endif %} \
          {% if wg_userspace %} -u {% endif %}

- name: "Generate conf files for server"
  hosts: clients
  remote_user: "{{ username }}"
  tasks:
    - name: Generate conf files for clients
      shell: |
        /tmp/scripts/wg_gen.py \
          -k /root/keypairs.json \
          -s /root/server_keypairs.json \
          -n {{ batch }} \
          -i {{ index[ansible_nodename] }} \
          {% if is_personal %} -m {% endif %} \
          -o /root/confs \
          {% if wg_userspace %} -u {% endif %} \
          -d {{ server_address }}
  

- name: Activate wireguard interfaces 
  hosts: [server, clients]
  remote_user: "{{ username_server }}"
  gather_facts: false

  tasks:
    - name: Activate server config
      shell: /tmp/scripts/activate_wg.sh
      ignore_errors: True