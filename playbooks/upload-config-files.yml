---
- name: Send necessary files to server 
  hosts: server
  remote_user: "{{ username_server }}"
  gather_facts: false

  tasks:
    - name: Send activate_wg.sh script
      template:
        src: ../templates/activate_wg.sh.jinja
        dest: /tmp/scripts/activate_wg.sh
    - name: Send client keypairs         
      template:
        src: ../static/keypairs.json
        dest: keypairs.json
    - name: Send median_val.py         
      template:
        src: ../templates/median_val.py
        dest: /tmp/median_val.py                    
    - name: Send server keypairs         
      template:
        src: ../static/server_keypairs.json          
        dest: server_keypairs.json
    - name: Send convert_to_csv script
      template:
        src: ../templates/convert_to_csv.py
        dest: /tmp/scripts/convert_to_csv.py
    - name: Send requirements for convert_to_csv script
      template:
        src: ../templates/requirements.txt
        dest: /tmp/scripts/requirements.txt
    - name: Send cpu_set.sh
      template:
        src: ../templates/cpu_set.sh
        dest: /tmp/scripts/cpu_set.sh
    - name: Send wireguard conf generator
      template:
        src: ../templates/wg_gen_server_conf.py
        dest: /tmp/scripts/wg_gen.py
    - name: Send trace.parser.py
      template:
        src: ../templates/trace.parser.py
        dest: /tmp/scripts/trace.parser.py
    - name: Send poll parser
      template:
        src: ../templates/poll.parser.py
        dest: /tmp/scripts/poll.parser.py
    - name: Send decrypt.parser.py
      template:
        src: ../templates/decrypt.parser.py
        dest: /tmp/scripts/decrypt.parser.py
    - name: Send perf.parser.py
      template:
        src: ../templates/perf.parser.py
        dest: /tmp/scripts/perf.parser.py
    - name: Send wg_test_decrypt_worker_analysis.sh
      template:
        src: ../templates/wg_test_decrypt_worker_analysis.sh
        dest: /tmp/scripts/wg_test_decrypt_worker_analysis.sh
    - name: Send wg_test_tx_worker_analysis.sh
      template:
        src: ../templates/wg_test_tx_worker_analysis.sh
        dest: /tmp/scripts/wg_test_tx_worker_analysis.sh
    - name: Send wg_test_scheduler_analysis.sh
      template:
        src: ../templates/wg_test_scheduler_analysis.sh
        dest: /tmp/scripts/wg_test_scheduler_analysis.sh
    - name: Send rx poll test
      template:
        src: ../templates/wg_test_rx_poll_analysis.sh
        dest: /tmp/scripts/wg_test_rx_poll_analysis.sh
    - name: Send wg_test_function_execution_time.sh
      template:
        src: ../templates/wg_test_function_execution_time.sh
        dest: /tmp/scripts/wg_test_function_execution_time.sh
    - name: Send wg_test_trace_printk.sh
      template:
        src: ../templates/wg_test_trace_printk.sh
        dest: /tmp/scripts/wg_test_trace_printk.sh
    - name: Send wg_test_global_perf.sh
      template:
        src: ../templates/wg_test_global_perf.sh
        dest: /tmp/scripts/wg_test_global_perf.sh
    - name: Send test.sh script
      template:
        src: ../templates/test.sh.jinja
        dest: /tmp/scripts/test.sh
    - name: Make all scripts executable
      shell:
        cmd: chmod +x -R /tmp/scripts


- name: Send necessary files to clients 
  hosts: clients
  remote_user: "{{ username_client }}"
  gather_facts: false

  tasks:
    - name: Send median_val.py         
      template:
        src: ../templates/median_val.py
        dest: /tmp/median_val.py     
    - name: Send client keypairs
      template:
        src: ../static/keypairs.json
        dest: keypairs.json
    - name: Send server keypairs
      template:
        src: ../static/server_keypairs.json
        dest: server_keypairs.json
    - name: Send client generator script
      template:
        src: ../templates/client_gen.sh.jinja
        dest: /tmp/scripts/test.sh
    - name: Send limit_bandwidth script
      template:
        src: ../templates/limit_bandwidth.sh.jinja
        dest: /tmp/scripts/limit_bandwidth.sh
    - name: Send unlimit_bandwidth script
      template:
        src: ../templates/unlimit_bandwidth.sh
        dest: /tmp/scripts/unlimit_bandwidth.sh
    - name: Send HEY script
      template:
        src: ../templates/hey_linux_amd64
        dest: /tmp/scripts/hey_linux_amd64
    - name: Send wireguard conf generator
      template:
        src: ../templates/wg_gen_client_conf.py
        dest: /tmp/scripts/wg_gen.py
    - name: Make all scripts executable
      shell:
        cmd: chmod +x -R /tmp/scripts

- name: Send necessary files to targets
  hosts: targets
  remote_user: "{{ username_target }}"
  gather_facts: false

  tasks:
    - name: Send netserver launcher
      template:
        src: ../templates/launch_netserver.sh.jinja
        dest: /tmp/scripts/test.sh
    - name: Send init_server.sh script
      template:
        src: ../templates/init_server.sh
        dest: /tmp/scripts/init_server.sh
    - name: Send TARGETS list
      template:
        src: ../EXPERIMENT_DATA/TARGETS
        dest: /tmp/scripts/TARGETS
    - name: Send NWEB lightweight http server
      template:
        src: ../templates/nweb
        dest: /tmp/scripts/nweb
    - name: Send Index file of 1M
      template:
        src: ../templates/index.html.1M
        dest: /var/www/html/file_1M.html
    - name: Send Index file of 100K
      template:
        src: ../templates/index.html.100K
        dest: /var/www/html/file_100K.html
    - name: Send Index file of 10K
      template:
        src: ../templates/index.html.10K
        dest: /var/www/html/file_10K.html
    - name: Send Index file of 1K
      template:
        src: ../templates/index.html.1K
        dest: /var/www/html/file_1K.html
    - name: Make all scripts executable
      shell: chmod +x -R /tmp/scripts
    
