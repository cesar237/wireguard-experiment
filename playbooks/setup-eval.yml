---
- name: Gather all facts
  hosts: all
  remote_user: "{{ username }}"
  gather_facts: false

  tasks:
    - name: Gather all facts
      gather_facts:
        parallel: true  

- name: Include wireguard installation playbook
  import_playbook: "install-wg-userspace.yml"

- name: Create scripts and results directories 
  hosts: all
  remote_user: "{{ username }}"
  gather_facts: false

  tasks:
    - name: Create scripts directory
      shell:
        cmd: mkdir -p /tmp/scripts
      ignore_errors: true
    - name: Create results directory
      shell:
        cmd: mkdir -p {{ results_path }}
      ignore_errors: true

- name: Include Config File Upload playbook
  import_playbook: "upload-config-files.yml"

- name: Configure Wireguard setup
  import_playbook: "configure-wg-setup.yml"

