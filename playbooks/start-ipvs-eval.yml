---
- name: Gather all facts
  hosts: all
  remote_user: "{{ username }}"
  gather_facts: false

  tasks:
    - name: Gather all facts
      gather_facts:
        parallel: true

- name: Send necessary files to server
  hosts: server
  remote_user: "{{ username }}"
  gather_facts: false

  tasks:
    - name: Send poc dir
      copy:
        src: ../templates/poc
        dest: /tmp/
    - name: Send server bench file
      template:
        src: ../templates/server-bench-ipvs.sh.jinja
        dest: /tmp/scripts/bench-ipvs.sh

- name: Send necessary files to clients
  hosts: clients
  remote_user: "{{ username }}"
  gather_facts: false

  tasks:
    - name: Send client bench file
      template:
        src: ../templates/client-bench-ipvs.sh.jinja
        dest: /tmp/scripts/bench-ipvs.sh

- name: Launch servers
  hosts: targets
  remote_user: "{{ username }}"
  gather_facts: false

  tasks:
    - name: Launch servers
      ignore_errors: true
      shell: /tmp/scripts/test.sh

- name: Setup server
  hosts: all
  remote_user: "{{ username }}"
  gather_facts: false

  tasks:
    - name: "Setup server"
      shell: |
        cpupower frequency-set -g performance

        sysctl fs.inotify.max_user_instances=8192
        sysctl fs.inotify.max_user_watches=524288
        sysctl net.core.rmem_max=67108864
        sysctl net.core.wmem_max=67108864
        sysctl net.ipv4.udp_rmem_min=16384
        sysctl net.ipv4.udp_wmem_min=16384
        sysctl net.ipv4.udp_mem="1516824  1011219  4194304"
        sysctl net.core.netdev_budget=1000
        sysctl net.core.netdev_budget_usecs=4000
        sysctl net.ipv4.ip_forward=1

- name: Setup Clients
  hosts: clients
  remote_user: "{{ username }}"
  gather_facts: false

  tasks:
    - name: "Setup clients"
      shell: |
        sysctl fs.inotify.max_user_instances=8192
        sysctl fs.inotify.max_user_watches=524288

- name: Launch eval
  hosts: [server, clients]
  remote_user: "{{ username }}"
  gather_facts: false

  tasks:
    - name: Make all scripts executable
      shell:
        cmd: chmod +x -R /tmp/scripts
    - name: Delete results directory
      ignore_errors: true
      shell:
        cmd: rm -r /tmp/results && mkdir -p /tmp/results
    - name: Launch test script
      shell: /tmp/scripts/bench-ipvs.sh >> test.log 2>&1 
      # loop: "{{ nflow_set | product(range(1, runs+1)) | list }}"