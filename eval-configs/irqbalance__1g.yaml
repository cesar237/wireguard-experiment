---
all:
  vars:
    # Testing type choice
    test_iperf3: true
    test_netperf: true
    test_hey: false
    test_deathstar: false

    # Network Configuration
    download: false
    bidirectional: false
    limited_bandwidth: True
    limit_bandwidth: "30mbit"

    # NETPERF args 
    netperf_testname: "TCP_STREAM" # type: TCP_STREAM, TCP_MAERTS
    latency_test : "TCP_RR" # Or UDP_RR for UDP
    latency_req_res_size: "1500,1500" # default "1,1"

    # IPERF3 args
    iperf_udp: False
    queue_length: 1024
    bandwidth: 1G
    packet_size: 128K # MAX = 1048576 and 1460 for UDP

    # IRQBalance/RSS config
    irqbalanced: true
    test_latency: false
    all_on_core_0: False
    deactivate_rss: true

    # NAPI/KTHREAD/WQ/SMT config
    pinned_napi: False
    threaded: 0
    hyperthreaded: True
    smt: "on"

    # Wireguard type choice
    wg_userspace: false
    wireguard_go_tailscale: False
    boringtun: false
    wireguard_rs: false

    # Sched policy
    apply_sched_policy: false
    sched_policy: "-o" # -o for default, -b for batch, -f for fifo, -r for round robin, -d for deadline
    sched_priority: 0 # 0 for default and batch, 1 for fifo and round robin
    