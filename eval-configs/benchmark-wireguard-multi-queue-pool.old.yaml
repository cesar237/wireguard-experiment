---
all:
  vars:
    ncore_set: "36"
    nflow_set: [100]
    unit_time_s: 80

    # batch params:
    wireguard_batch: True
    batch_sizes: [2, 4, 8, 16, 32]
    concurrency_levels: [2, 4, 8, 16, 32]
    custom_kernel_on: 'server'

    # Multi queue param:
    wireguard_multi_queue: True
    wg_nr_rings: [2, 4, 8, 18]

    # Testing type choice
    test_iperf3: true
    test_netperf: false
    test_hey: false
    test_deathstar: false

    # Network Configuration
    download: false
    bidirectional: false

    # NETPERF args 
    netperf_testname: "TCP_STREAM" # type: TCP_STREAM, TCP_MAERTS
    latency_test : "TCP_RR" # Or UDP_RR for UDP
    latency_req_res_size: "1500,1500" # default "1,1"

    # IPERF3 args
    iperf_udp: False
    queue_length: 1024
    bandwidth: 300Mbits
    packet_size: 128K # MAX = 1048576 and 1460 for UDP

    # IRQBalance/RSS config
    irqbalanced: true
    test_latency: false
    all_on_core_0: False
    deactivate_rss: false

    # NAPI/KTHREAD/WQ/SMT config
    pinned_napi: False
    threaded: 0
    hyperthreaded: false
    smt: "off"

    # SOCKPERF args
    PPS: 12500 #per client throuhgput in pps, used with SOCKPERF
    SOCKPERF_TRAFFIC: tcp # tcp|udp test
    MSG_LEN: 1500

    # RPS/RFS config
    enable_rps: false
    enable_rfs: false

    # Wireguard type choice
    custom_kernel: true
    version_kernel: wireguard-multi-queue-table
    custom_go: false
    version_go: partial_encrypt # partial_encrypt or no_encrypt
    wg_userspace: false
    wireguard_go_tailscale: false
    boringtun: false
    wireguard_rs: false

    # Sched policy
    apply_sched_policy: false
    sched_policy: "-o" # -o for default, -b for batch, -f for fifo, -r for round robin, -d for deadline
    sched_priority: 0 # 0 for default and batch, 1 for fifo and round robin
    runs: 1
    wait_server: 0
    wait_client: 0
    
