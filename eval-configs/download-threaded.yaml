---
all:
  vars:
    ncore_set: "36"
    nflow_set: "1 10 30 50 80 100"
    unit_time_s: 65

    # ncore_set: "36"
    # nflow_set: "100"
    # unit_time_s: 120

    # Testing type choice
    test_iperf3: true
    test_netperf: false
    test_hey: false
    test_deathstar: false

    # Network Configuration
    download: true
    bidirectional: false

    # NETPERF args 
    netperf_testname: "TCP_STREAM" # experiments-results/outputs/extract_throughput.sh experiments-results/outputs/extract_latency.sh experiments-results/outputs/extract_cpu.shtype: TCP_STREAM, TCP_MAERTS
    latency_test : "TCP_RR" # Or UDP_RR for UDP
    latency_req_res_size: "1500,1500" # default "1,1"

    # IPERF3 args
    iperf_udp: False
    queue_length: 1024
    bandwidth: 25G
    packet_size: 128K # MAX = 1048576 and 1460 for UDP

    # IRQBalance/RSS config
    irqbalanced: true
    test_latency: false
    all_on_core_0: False
    deactivate_rss: False

    # NAPI/KTHREAD/WQ/SMT config
    pinned_napi: False
    threaded: 1
    hyperthreaded: True
    smt: "on"

    # RPS/RFS config
    enable_rps: false
    enable_rfs: false

    # Wireguard type choice
    custom_kernel: false
    version_kernel: no_encrypt
    custom_go: false
    version_go: partial_encrypt # partial_encrypt or no_encrypt
    wg_userspace: false
    wireguard_go_tailscale: false
    boringtun: false
    wireguard_rs: false

    # Sched policy
    apply_sched_policy: false
    sched_policy: "-o" # -o for default, -b for batch, -f for fifo, -r for round robin, -d for deadline
    sched_priority: 0 # 0 for default and batch, 1 for fifo and round robin
    runs: 12
    wait_server: 0
    wait_client: 3
    